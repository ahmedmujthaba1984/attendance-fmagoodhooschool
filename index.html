<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Magoodhoo School Attendance & Analytics Portal</title>
    <meta name="description" content="Production-ready, offline-first attendance portal tailored for F. Magoodhoo School, Maldives with Dhivehi/Thaana RTL support, dual sessions, voice dictation, and MoE compliance exports." />
    <meta property="og:title" content="Magoodhoo School Attendance & Analytics Portal" />
    <meta property="og:description" content="Production-ready, offline-first attendance portal tailored for F. Magoodhoo School, Maldives with Dhivehi/Thaana RTL support, dual sessions, voice dictation, and MoE compliance exports." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Magoodhoo School" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="alternate icon" type="image/svg+xml" href="/icon.svg" />
    
    <!-- Preload Faruma Font for Dhivehi / Thaana typography -->
    <link rel="preload" href="/fonts/Faruma.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Google Fonts: Noto Sans Thaana & Plus Jakarta Sans (fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thaana:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Gracefully handle preview/iframe environment: HMR is disabled, intercept Vite WebSocket attempts
      (function() {
        if (typeof window !== 'undefined') {
          // 1. Silent stub for Vite HMR WebSockets so browser console stays clean
          if (window.WebSocket) {
            var NativeWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var isHmr = (protocols === 'vite-hmr') || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1));
              if (isHmr) {
                var listeners = {};
                var dummy = {
                  readyState: 1, // OPEN
                  url: url,
                  protocol: 'vite-hmr',
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  addEventListener: function(type, fn) {
                    listeners[type] = listeners[type] || [];
                    listeners[type].push(fn);
                  },
                  removeEventListener: function(type, fn) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                    }
                  },
                  dispatchEvent: function() { return false; },
                  send: function() {},
                  close: function() {
                    dummy.readyState = 3;
                    if (dummy.onclose) dummy.onclose({ code: 1000, reason: 'closed', wasClean: true });
                    if (listeners['close']) {
                      listeners['close'].forEach(function(fn) { fn({ code: 1000, reason: 'closed', wasClean: true }); });
                    }
                  }
                };
                return dummy;
              }
              return new NativeWebSocket(url, protocols);
            };
            window.WebSocket.prototype = NativeWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          // 2. Filter out harmless Vite HMR connection log messages
          var origError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var str = args.join(' ');
            if (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('websocket') !== -1
            ) {
              return;
            }
            origError.apply(console, arguments);
          };

          var origWarn = console.warn;
          console.warn = function() {
            var args = Array.prototype.slice.call(arguments);
            var str = args.join(' ');
            if (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('websocket') !== -1
            ) {
              return;
            }
            origWarn.apply(console, arguments);
          };

          // 3. Catch unhandled rejections and global errors from HMR
          window.addEventListener('unhandledrejection', function(event) {
            if (event && event.reason && (
              (typeof event.reason === 'string' && (event.reason.indexOf('WebSocket') !== -1 || event.reason.indexOf('vite') !== -1)) ||
              (event.reason.message && (event.reason.message.indexOf('WebSocket') !== -1 || event.reason.message.indexOf('vite') !== -1))
            )) {
              event.preventDefault();
            }
          });

          window.addEventListener('error', function(event) {
            if (event && (
              (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('vite') !== -1)) ||
              (event.filename && event.filename.indexOf('@vite/client') !== -1)
            )) {
              event.preventDefault();
            }
          });
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
